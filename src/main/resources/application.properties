spring.application.name=hello
server.port=8080

spring.datasource.url=jdbc:postgresql://pg-hello-poc.postgres.database.azure.com:5432/demo?sslmode=require
spring.datasource.username=hello-app-mi
spring.datasource.azure.passwordless-enabled=true
spring.cloud.azure.credential.managed-identity-enabled=true
spring.cloud.azure.credential.client-id=7c7dbd38-b3a0-49c6-a55a-27a6237645cf

# Redis (MSI passwordless, Azure Managed Redis)
spring.data.redis.host=redis-hello-poc.eastasia.redis.azure.net
spring.data.redis.port=10000
spring.data.redis.ssl.enabled=true
spring.data.redis.username=fd30a409-df43-426c-8593-58e4cbae0eec
spring.data.redis.azure.passwordless-enabled=true

# Event Hubs (MSI passwordless)
spring.cloud.azure.eventhubs.namespace=eh-hello-poc
spring.cloud.azure.eventhubs.event-hub-name=hello-hub

# Storage Blob (MSI passwordless)
spring.cloud.azure.storage.blob.account-name=sthellopoc
spring.cloud.azure.storage.blob.endpoint=https://sthellopoc.blob.core.windows.net

# Key Vault (MSI passwordless)
spring.cloud.azure.keyvault.secret.endpoint=https://kv-hello-poc.vault.azure.net/

# Azure OpenAI (MSI passwordless, OpenAI 兼容端点)
spring.cloud.azure.openai.endpoint=https://openai-hello-poc.openai.azure.com
spring.cloud.azure.openai.deployment-name=gpt-4-1-mini
